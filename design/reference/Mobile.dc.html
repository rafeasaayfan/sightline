<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vantage — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
button{font-family:inherit}
.chip{clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0D12; color: #F3F5F8; display: flex; flex-direction: column">
  <header style="height: 56px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.10)">
    <div class="chip" style="background: #38E1FF; color: #0A0D12; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .14em; padding: 6px 14px">VANTAGE</div>
  </header>

  <!-- stage -->
  <div style="position: relative; width: 390px; height: 219px; background: radial-gradient(120% 90% at 30% 20%, #1E2A3A 0%, #0D1219 55%, #05070A 100%)">
    <div class="chip" style="position: absolute; top: 10px; left: 10px; background: rgba(18,22,29,.88); font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .06em; padding: 6px 12px; border-top: 2px solid #38E1FF">RND 07 · <span style="color: #38E1FF">11</span>–<span style="color: #FFB020">9</span></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 8px 4px; background: linear-gradient(to top, rgba(10,13,18,.96), rgba(10,13,18,0)); display: flex; flex-direction: column; gap: 2px">
      <div style="position: relative; height: 24px; margin: 0 8px; display: flex; align-items: center">
        <div style="position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18)"></div>
        <div style="position: absolute; left: 0; width: 49%; height: 4px; border-radius: 2px; background: #38E1FF"></div>
        <div style="position: absolute; left: 22%; top: 50%; transform: translate(-50%,-50%)"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 12 12"><path d="M6 0l6 6-6 6-6-6z" fill="#FFB020"/></svg></div>
        <div style="position: absolute; left: 70%; top: 50%; transform: translate(-50%,-50%)"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 12 12"><path d="M6 0l6 6-6 6-6-6z" fill="#FFB020"/></svg></div>
        <div style="position: absolute; left: 49%; top: 50%; transform: translate(-50%,-50%); width: 18px; height: 18px; border-radius: 50%; background: #F3F5F8; box-shadow: 0 0 0 3px rgba(56,225,255,.45)"></div>
      </div>
      <div style="display: flex; align-items: center">
        <button aria-label="Pause" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F3F5F8; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="4" height="14"/><rect x="12" y="3" width="4" height="14"/></svg></button>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-variant-numeric: tabular-nums">12:04 <span style="color: #9AA3B2">/ 24:37</span></span>
        <div style="flex: 1 1 auto"></div>
        <button aria-label="Next highlight" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F3F5F8; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4l8 6-8 6"/><path d="M15 4v12"/></svg></button>
        <button aria-label="Mute" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F3F5F8; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h3l4-3v10l-4-3H3z"/><path d="M13 7a4 4 0 010 6"/></svg></button>
        <button aria-label="Fullscreen" style="width: 48px; height: 48px; border: 0; background: transparent; color: #F3F5F8; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5"/></svg></button>
      </div>
    </div>
  </div>

  <!-- angle chips -->
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #9AA3B2">ANGLES</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button aria-pressed="true" style="height: 64px; border-radius: 10px; border: 2px solid #38E1FF; background: #12161D; color: #F3F5F8; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 10px; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #38E1FF">1</span><span style="font-size: 12px; font-weight: 600">Player 1</span></button>
      <button aria-pressed="false" style="height: 64px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #12161D; color: #F3F5F8; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 10px; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3B2">2</span><span style="font-size: 12px; font-weight: 600">Player 2</span></button>
      <button aria-pressed="false" style="height: 64px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: #12161D; color: #F3F5F8; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 0 10px; gap: 2px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9AA3B2">3</span><span style="font-size: 12px; font-weight: 600">Map</span></button>
    </div>
  </div>

  <!-- recap -->
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: .12em; color: #9AA3B2">RECAP · TAP TO JUMP</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button style="height: 52px; display: flex; align-items: center; gap: 12px; background: #12161D; border: 1px solid rgba(255,255,255,.10); border-left: 3px solid #FFB020; color: #F3F5F8; border-radius: 8px; padding: 0 14px; font-size: 14px; text-align: left"><span style="font-family: 'JetBrains Mono', monospace; color: #9AA3B2; font-size: 12px">03:12</span>Elimination · P1</button>
      <button style="height: 52px; display: flex; align-items: center; gap: 12px; background: #12161D; border: 1px solid rgba(255,255,255,.10); border-left: 3px solid #38E1FF; color: #F3F5F8; border-radius: 8px; padding: 0 14px; font-size: 14px; text-align: left"><span style="font-family: 'JetBrains Mono', monospace; color: #9AA3B2; font-size: 12px">07:40</span>Objective captured</button>
      <button style="height: 52px; display: flex; align-items: center; gap: 12px; background: #1A2130; border: 1px solid rgba(56,225,255,.35); border-left: 3px solid #FFB020; color: #F3F5F8; border-radius: 8px; padding: 0 14px; font-size: 14px; text-align: left"><span style="font-family: 'JetBrains Mono', monospace; color: #38E1FF; font-size: 12px">12:04</span>Elimination · P1 <span style="margin-left: auto; font-size: 11px; color: #38E1FF; font-weight: 600; letter-spacing: .08em">NOW</span></button>
      <button style="height: 52px; display: flex; align-items: center; gap: 12px; background: #12161D; border: 1px solid rgba(255,255,255,.10); border-left: 3px solid #FFB020; color: #F3F5F8; border-radius: 8px; padding: 0 14px; font-size: 14px; text-align: left"><span style="font-family: 'JetBrains Mono', monospace; color: #9AA3B2; font-size: 12px">14:20</span>Clutch · 1v3</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
